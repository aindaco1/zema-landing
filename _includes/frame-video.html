<section class="scrub-story" id="top" data-scrub-story aria-label="An introduction to ZEMA Vinyl Lounge">
  <div class="scrub-story__sticky">
    <div class="scrub-story__media" aria-hidden="true" style="--media-focal-x: {{ include.hero.focal_x }}%; --media-focal-y: {{ include.hero.focal_y }}%;">
      <img src="{{ include.hero.poster | relative_url }}?v={{ site.asset_version }}" alt="" width="1920" height="1080" fetchpriority="high">
      <video muted playsinline preload="none" tabindex="-1" data-scrub-video data-src="{{ include.hero.video_mp4 | relative_url }}?v={{ site.asset_version }}"></video>
    </div>
    <div class="scrub-story__shade" aria-hidden="true"></div>
    <div class="scrub-story__beats">
      {% for beat in include.hero.beats %}
        <div class="scrub-beat{% if forloop.first %} is-active{% endif %}" data-scrub-beat aria-hidden="{% unless forloop.first %}true{% else %}false{% endunless %}"{% unless forloop.first %} inert{% endunless %}>
          <p class="eyebrow">{{ beat.eyebrow }}</p>
          {% if forloop.first %}<h1>{% if beat.title_mark %}<span class="scrub-beat__mark">{{ beat.title_mark }}</span> {% endif %}{{ beat.title }}</h1>{% else %}<h2>{{ beat.title }}</h2>{% endif %}
          <p>{{ beat.copy }}</p>
          {% if forloop.last %}
            <a class="button button--light" href="#inquire">Plan an evening</a>
          {% endif %}
        </div>
      {% endfor %}
    </div>
    <div class="scroll-cue" aria-hidden="true">
      <span>Scroll to enter</span>
      <i></i>
    </div>
  </div>
</section>
