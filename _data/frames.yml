      closes: 23:00
  notes:
    - Happy hour is Monday–Thursday, 6–7 PM, with $2 off house cocktails.
    - Last call is 30 minutes before close.
    - The ready-to-drink menu is available daily from 10 AM at Hotel Zazz.
  faqs:
    - q: Do I need a reservation?
      a: Walk-ins are welcome when space allows. Reservations are highly suggested on
        weekends and event nights, and requested for groups larger than three.
    - q: How long is a reservation?
      a: Reserved seating is held for 90 minutes beginning at the reservation time.
    - q: Is there parking?
      a: Yes. Free street parking is available around Hotel Zazz in Nob Hill.
    - q: Is there food?
      a: The lounge offers nightly snacks and regularly welcomes local food trucks.
    - q: What happens at ZEMA?
      a: Expect curated vinyl, musical guests, community gatherings, and special
        events. Check the current calendar before your visit.
