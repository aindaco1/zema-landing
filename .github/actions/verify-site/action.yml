name: Verify ZEMA site
description: Install pinned toolchains, run every contract and browser test, and build the production site.

runs:
  using: composite
  steps:
    - name: Install actionlint
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/actionlint"
        curl --fail --location --silent --show-error \
          --output "$RUNNER_TEMP/actionlint/actionlint.tar.gz" \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/actionlint.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/actionlint/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
        echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: "3.3"
        bundler-cache: true

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"
        cache: npm

    - name: Install JavaScript dependencies
      shell: bash
      run: npm ci

    - name: Install Chromium
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Run content, documentation, Worker, and browser tests
      shell: bash
      run: npm test

    - name: Build production site
      shell: bash
      env:
        JEKYLL_ENV: production
      run: bundle exec jekyll build
